<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">
  <defs>
    <linearGradient id="react-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007bff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g>
      <circle cx="50" cy="50" r="8" fill="url(#react-grad)"/>
      <g fill="none" stroke="url(#react-grad)" stroke-width="4" stroke-linecap="round">
        <ellipse cx="50" cy="50" rx="40" ry="16" transform="rotate(30 50 50)"/>
        <ellipse cx="50" cy="50" rx="40" ry="16" transform="rotate(150 50 50)"/>
        <ellipse cx="50" cy="50" rx="40" ry="16" transform="rotate(270 50 50)"/>
      </g>
  </g>

  <text x="50" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="url(#react-grad)">React Native</text>
</svg>